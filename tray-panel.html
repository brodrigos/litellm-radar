<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>LiteLLM Cons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(51, 65, 85, 0.6);
            overflow: hidden;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.7);
        }
    </style>
</head>
<body class="text-slate-100 h-screen flex flex-col font-sans">
    <!-- Header / Drag region -->
    <div class="px-4 py-3 bg-slate-900/80 border-b border-slate-800 flex justify-between items-center" style="-webkit-app-region: drag;">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                <i class="fa-solid fa-gauge-high text-sm"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-tight text-white leading-none">LiteLLM Cons</h1>
                <span class="text-[10px] text-slate-400 font-medium">Quota Free Tier (RPD - Req/Dia)</span>
            </div>
        </div>
        <div class="flex items-center gap-1.5" style="-webkit-app-region: no-drag;">
            <button onclick="refreshData()" title="Atualizar" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-rotate text-xs" id="refresh-icon"></i>
            </button>
            <button onclick="openSettings()" title="Configurações" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-gear text-xs"></i>
            </button>
            <button onclick="hideWindow()" title="Ocultar" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Models List Container -->
    <div id="models-list" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="text-center py-12 text-slate-500">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
            <p class="text-xs">Carregando cotas RPD...</p>
        </div>
    </div>

    <!-- Footer Status -->
    <div class="px-4 py-2.5 bg-slate-900/90 border-t border-slate-800 text-[11px] text-slate-400 flex justify-between items-center">
        <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="status-dot"></span>
            <span id="status-text">Gateway Conectado</span>
        </div>
        <span id="last-update" class="text-slate-500">-</span>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        let config = {
            maxRequests: {
                default: 1500,
                'groq-fast': 14400,
                'gemini-fallback': 1500,
                'gemini-3.5-flash': 1500,
                'gemini-3.6-flash': 1500,
                'gemini-3.5-flash-lite': 1500,
                'or-super-vl': 200,
                'or-flint': 200,
                'or-lightning': 200,
                'or-north': 200,
                'cloudflare-last': 1000
            }
        };

        const standardModels = [
            { id: 'gemini-3.5-flash', name: 'gemini-3.5-flash', color: 'from-blue-500 to-cyan-500' },
            { id: 'gemini-3.6-flash', name: 'gemini-3.6-flash', color: 'from-cyan-500 to-teal-500' },
            { id: 'gemini-3.5-flash-lite', name: 'gemini-3.5-flash-lite', color: 'from-indigo-500 to-blue-500' },
            { id: 'gemini-fallback', name: 'gemini-fallback', color: 'from-blue-600 to-indigo-600' },
            { id: 'groq-fast', name: 'groq-fast', color: 'from-amber-500 to-orange-500' },
            { id: 'or-super-vl', name: 'or-super-vl', color: 'from-emerald-500 to-green-500' },
            { id: 'or-flint', name: 'or-flint', color: 'from-purple-500 to-pink-500' },
            { id: 'cloudflare-last', name: 'cloudflare-last', color: 'from-violet-500 to-purple-500' }
        ];

        async function init() {
            try {
                const cfg = await ipcRenderer.invoke('get-config');
                if (cfg && cfg.maxRequests) {
                    config = cfg;
                }
            } catch (e) {}
            refreshData();
            setInterval(refreshData, 30000);
        }

        async function refreshData() {
            const icon = document.getElementById('refresh-icon');
            if (icon) icon.classList.add('fa-spin');

            const res = await ipcRenderer.invoke('fetch-usage');
            
            if (icon) {
                setTimeout(() => icon.classList.remove('fa-spin'), 500);
            }

            const now = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('last-update').innerText = now;

            const usageMap = res.success ? res.usage : {};
            renderModels(usageMap);
        }

        function renderModels(usageMap) {
            const container = document.getElementById('models-list');
            container.innerHTML = '';

            standardModels.forEach(m => {
                const usedReqs = usageMap[m.id] || usageMap[m.name] || usageMap['litellm/' + m.id] || 0;
                const maxReqs = (config.maxRequests && config.maxRequests[m.id]) || config.maxRequests?.default || 1500;
                
                // Percentage consumed of daily RPD limit
                const percent = Math.min(100, Math.max(1, Math.round((usedReqs / maxReqs) * 100)));
                const remaining = Math.max(0, maxReqs - usedReqs);

                // Color urgency: green < 70%, amber < 90%, red >= 90%
                let barColor = m.color;
                if (percent >= 90) barColor = 'from-rose-500 to-red-600';
                else if (percent >= 70) barColor = 'from-amber-500 to-yellow-500';

                const card = document.createElement('div');
                card.className = 'bg-slate-900/60 border border-slate-800/80 rounded-xl p-3 shadow-sm hover:border-slate-700 transition-all';
                
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="text-xs font-bold text-white flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full ${percent >= 90 ? 'bg-rose-500 animate-ping' : 'bg-emerald-400'}"></span>
                            ${m.name}
                        </span>
                        <div class="text-[11px] font-mono text-slate-300">
                            <span class="font-bold text-indigo-400">${usedReqs} reqs</span>
                            <span class="text-slate-500">/ ${maxReqs} (Restam: <strong class="text-emerald-400">${remaining}</strong>)</span>
                        </div>
                    </div>
                    <div class="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800/50">
                        <div class="bg-gradient-to-r ${barColor} h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                    </div>
                    <div class="flex justify-between items-center mt-1 text-[10px] text-slate-500">
                        <span>Cota RPD utilizada</span>
                        <span>${percent}%</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openSettings() {
            ipcRenderer.invoke('open-settings-window');
        }

        function hideWindow() {
            window.close();
        }

        ipcRenderer.on('config-updated', (event, newCfg) => {
            config = newCfg;
            refreshData();
        });

        init();
    </script>
</body>
</html>
